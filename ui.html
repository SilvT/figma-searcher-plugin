  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ==========================================================
     DESIGN TOKENS — Swiss Curve
     Same palette in both themes; body.dev-mode (set from
     Figma's editorType message) swaps the dark-mode block.
     ========================================================== */
  :root {
    /* Color — surface */
    --color-bg:           #ece7db;  /* plugin frame background (grid lives here) */
    --color-surface:      #ffffff;  /* panel / dropdown / row background */
    --color-surface-soft: #ece5d2;  /* nested tracks, cards */
    --color-grid:         rgba(127, 127, 127, 0.10);

    /* Color — ink */
    --color-ink:        #111111;
    --color-ink-2:       #2b2b2b;  /* hover shade for ink-filled buttons */
    --color-ink-dim:    rgba(17, 17, 17, 0.64);
    --color-ink-faint:  rgba(17, 17, 17, 0.40);
    --color-on-ink:     #ffffff;   /* text sitting on an ink-filled surface */

    /* Color — border */
    --color-border:      #111111;
    --color-border-soft: rgba(17, 17, 17, 0.16);

    /* Color — accent */
    --color-accent:        #c96053;
    --color-accent-ink:    #ffffff;
    --color-accent-soft:   rgba(201, 96, 83, 0.12);
    --color-accent-border: rgba(201, 96, 83, 0.28);
    --color-focus-ring:    rgba(201, 96, 83, 0.18);

    /* Color — glass (floating nav) */
    --color-glass-bg:        rgba(255, 255, 255, 0.55);
    --color-glass-highlight: rgba(255, 255, 255, 0.70);
    --color-glass-shadow:    rgba(17, 17, 17, 0.14);
    --color-glass-hover:     rgba(17, 17, 17, 0.06);
    --color-shadow-nav:      rgba(0, 0, 0, 0.14);  /* floating-nav drop shadow, same both themes */

    /* Color — Figma "background/primary", "background/elevated" and
       "border/default"+"effect/default" tokens (the last two share one
       value in the Figma file, used for both a border and a shadow color) */
    --color-surface-tint: #f7f5ed;
    --color-elevated:     #f7f7f7;
    --color-line-default: rgba(17, 17, 17, 0.3);
    --color-neutral-gray: #7f7f7f;  /* Figma "neutral/gray" — same value works on both themes */
    --color-link-visited: #742d25;  /* Figma "brand/red-dark" */
    --color-accent-glow:  rgba(201, 96, 83, 0.3);  /* Figma "effect/accent", link focus ring */
    --color-fill-overlay: rgba(127, 127, 127, 0.1);  /* Figma "fill/overlay", primary-button disabled fill */

    /* Radius */
    --radius-sm:   6px;
    --radius-md:   12px;
    --radius-xl:   12px;
    --radius-full: 999px;  /* pill / fully-rounded */

    /* Spacing scale — half-steps (x.5) fill gaps the design reuses often
       enough to warrant a token, without changing the whole scale's rhythm */
    --space-0-5: 2px;
    --space-1:   4px;
    --space-1-5: 6px;
    --space-2:   8px;
    --space-2-5: 10px;
    --space-3:   12px;
    --space-3-5: 14px;
    --space-4:   16px;
    --space-5:   20px;  /* matches Figma spacing/4xl */
    --space-6:   40px;  /* matches Figma spacing/6xl */

    /* One-off but reused-twice gap, doesn't fit the space scale's rhythm */
    --gap-nav: 22px;  /* floating-nav / mode-bar icon-row gap */

    /* Typography */
    --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --text-3xs: 8px;
    --text-2xs: 10px; 
    --text-xs:  11px;
    --text-sm:  12px;
    --text-md:  14px;

    --weight-regular:  400;
    --weight-medium:   500;
    --weight-semibold: 600;
    --weight-bold:     700;
    --weight-display:  800;
  }

  body.dev-mode {
    --color-bg:           #0d0d0d;
    --color-surface:      #141414;
    --color-surface-soft: #1c1c1a;

    --color-ink:       #f4f4f0;
    --color-ink-2:      #d8d8d4;
    --color-ink-dim:   rgba(244, 244, 240, 0.66);
    --color-ink-faint: rgba(244, 244, 240, 0.42);
    --color-on-ink:    #111111;

    --color-border:      #f4f4f0;
    --color-border-soft: rgba(244, 244, 240, 0.18);

    --color-accent:        #e08977;
    --color-accent-ink:    #111111;
    --color-accent-soft:   rgba(224, 137, 119, 0.16);
    --color-accent-border: rgba(224, 137, 119, 0.32);
    --color-focus-ring:    rgba(224, 137, 119, 0.20);

    --color-glass-bg:        rgba(30, 30, 28, 0.55);
    --color-glass-highlight: rgba(255, 255, 255, 0.12);
    --color-glass-shadow:    rgba(0, 0, 0, 0.45);
    --color-glass-hover:     rgba(255, 255, 255, 0.08);

    --color-surface-tint: #1f1f1c;
    --color-elevated:     #232320;
    --color-line-default: rgba(244, 244, 240, 0.3);
    --color-accent-glow:  rgba(224, 137, 119, 0.3);
  }

  /* ==========================================================
     BASE
     ========================================================== */
  body {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
    background-image:
      linear-gradient(var(--color-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    /* The floating-nav is position:fixed to the top-right corner, sitting on the
       same row as the section title, so no extra clearance is needed here. */
  }


  a{
    color: var(--color-accent);
    text-decoration: none;
    font-family: var(--font-mono);
    font-weight: var(--weight-medium);
    border-radius: 2px;
  }
  a:hover{
    color: var(--color-ink);
    text-decoration: underline;
    text-decoration-style: solid;
  }
  a:visited{
    color: var(--color-link-visited);
    text-decoration: underline;
    text-decoration-style: dashed;
  }
  a:focus-visible{
    outline: none;
    box-shadow:
      2px 0px 4px var(--color-accent-glow),
      -2px 0px 4px var(--color-accent-glow),
      0px 2px 4px var(--color-accent-glow),
      0px -2px 4px var(--color-accent-glow);
  }

  .mode-bar {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    flex-shrink: 0;
  }

  /* Top navigation: lives inline in the page header, alongside the active
     section's title — moved between title elements in JS as the section
     changes (see positionNav()), not fixed/floating over the content. */
  .section-tabs {
    display: flex;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  /* Floating "liquid glass" pill nav: Find / Settings */
  .floating-nav {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    gap: 16px;
    padding: var(--space-1-5) var(--space-4);
    background: var(--color-glass-bg);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    border-left: 1.5px solid var(--color-line-default);
    border-right: 1.5px solid var(--color-line-default);
    box-shadow: 0px 4px 16px var(--color-shadow-nav);
  }

  .section-tab {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--color-ink-dim);
    cursor: pointer;
    transition: color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  /* Custom tooltip (native `title` tooltips are slow and inconsistent inside
     the plugin iframe) — reads its text from data-tooltip on the button. */
  .section-tab::after {
    content: attr(data-tooltip);
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    background: var(--color-ink);
    color: var(--color-on-ink);
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    font-weight: var(--weight-medium);
    padding: var(--space-1) var(--space-2);
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s, transform 0.12s;
    z-index: 2000;
  }
  .section-tab:hover::after,
  .section-tab:focus-visible::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .section-tab svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
  }

  .section-tab:hover {
    background: var(--color-glass-hover);
    color: var(--color-ink);
  }

  .section-tab.active {
    color: var(--color-accent-ink);
    background: var(--color-accent);
    border-radius: 4px;
  }

  .section-tab.settings-tab.active {
    color: var(--color-on-ink);
    background: var(--color-ink);
    box-shadow: none;
  }

  body.multi-search-active .scope-container {
    display: none;
  }

  body.multi-search-active .mode-tab[data-mode="style"],
  body.multi-search-active .mode-tab[data-mode="effect"] {
    pointer-events: none;
    opacity: 0.4;
  }

  .library-settings, .settings-title {
    display: none;
  }

  body.library-settings-open .settings-title {
    display: flex;
    margin: var(--space-2) var(--space-5) var(--space-2);
  }

  .button-tertiary {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    background: var(--color-ink);
    color: var(--color-on-ink);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--space-1-5) var(--space-3);
    font-family: var(--font-mono);
    font-weight: var(--weight-medium);
    font-size: var(--text-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
  }
  .button-tertiary:hover:not(:disabled) {
    background: var(--color-ink-2);
  }

  /* Settings panel is exclusive: hide every other section while it's open. */
  body.library-settings-open .mode-row,
  body.library-settings-open .foundations-card {
    display: none !important;
  }

  body.library-settings-open .library-settings {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    gap: var(--space-4);
    margin: 0 var(--space-5) var(--space-4);
    overflow-y: auto;
  }

  /* Each settings section ("Core Library", "Credits") is its own card,
     matching the .foundations-card / .component-row treatment used
     elsewhere: white surface, subtle border, radius/md. */
  .settings-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    align-items: flex-start;
    background: var(--color-surface);
    border: 1px solid var(--color-border-soft);
    border-radius: 6px; /* Figma radius/md */
    padding: var(--space-5);
    width: 100%;
    box-sizing: border-box;
  }

  .settings-card-title {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    color: var(--color-ink);
  }

  .settings-card-desc {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-ink-faint);
    width: 100%;
  }

  .credits-plugin-name {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-ink);
  }

  .credits-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--color-ink-dim);
  }

  .credits-row span:last-child {
    color: var(--color-ink);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
  }

  /* The title row also hosts the floating-nav pill (moved in here via JS,
     see positionNav()), so it's laid out as a header: label on the left,
     nav flush right. Display isn't set here — the settings title
     is display:none by default (see the shared hidden-panel rule above)
     and only become flex via their own body-class-scoped "active" rule,
     which needs to win over that none without a specificity fight. */
  .section-title {
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin: 0 0 var(--space-4);
  }

  #foundationsCardTitle {
    display: flex;
  }

  .section-title-text {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: var(--weight-display);
    color: var(--color-ink);
  }

  .foundations-card {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    padding: var(--space-2) var(--space-5) var(--space-5);
    /* gap: var(--space-2); */
    gap: 0;

  }
  #queryMulti { display: none; }
  body.multi-search-active #query { display: none; }
  body.multi-search-active #queryMulti { display: block; }

  textarea#queryMulti {
    flex: 1;
    min-width: 120px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-soft);
    border-radius: var(--radius-sm);
    padding: var(--space-2) 10px;
    color: var(--color-ink);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    outline: none;
    transition: border-color 0.1s, background 0.1s;
    resize: vertical;
    min-height: 60px;
    line-height: 1.5;
  }
  textarea#queryMulti:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-focus-ring);
  }
  textarea#queryMulti::placeholder { color: var(--color-ink-faint); font-weight: var(--weight-regular); font-size: var(--text-xs); }

  .multi-hint {
    display: none;
    font-size: var(--text-2xs);
    font-weight: var(--weight-regular);
    color: var(--color-ink-faint);
  }
  body.multi-search-active .multi-hint { display: block; }

  .ignore-nesting-container {
    display: none;
    align-items: center;
    gap: var(--space-1-5);
  }
  body.multi-search-active .ignore-nesting-container { display: flex; }

  .toggle-label {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-ink);
    white-space: nowrap;
  }

  .toggle-switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .toggle-switch input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
    z-index: 1;
  }
  .toggle-slider {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-sizing: border-box;
    height: 16px;
    min-width: 37px;
    padding: 2px;
    background: var(--color-surface);
    border: 1px solid var(--color-ink);
    border-radius: 4px;
    transition: background 0.12s, border-color 0.12s;
  }
  .toggle-slider::before {
    content: '';
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    border-radius: 3px;
    background: var(--color-ink);
    transition: background 0.12s;
  }
  /* Selected: track fills black, knob slides to the end and turns white. */
  .toggle-switch input:checked + .toggle-slider {
    justify-content: flex-end;
    background: var(--color-ink);
    border-color: var(--color-ink);
  }
  .toggle-switch input:checked + .toggle-slider::before {
    background: var(--color-on-ink);
  }
  /* Hover: track (and border) turns accent regardless of selected state; knob
     color is untouched since it's already state-appropriate (black/white). */
  .toggle-switch:hover .toggle-slider {
    background: var(--color-accent);
    border-color: var(--color-accent);
  }
  .toggle-switch input:focus-visible + .toggle-slider {
    border-color: var(--color-accent);
  }
  /* Disabled: track always reverts to white/tertiary-bordered regardless of
     selected state; knob and label both mute to tertiary ink. */
  .toggle-switch input:disabled + .toggle-slider {
    background: var(--color-surface);
    border-color: var(--color-ink-faint);
    cursor: not-allowed;
  }
  .toggle-switch input:disabled + .toggle-slider::before {
    background: var(--color-ink-faint);
  }
  .toggle-switch:has(input:disabled) {
    cursor: not-allowed;
  }
  .toggle-label:has(+ .toggle-switch input:disabled) {
    color: var(--color-ink-faint);
  }

  .mode-row {
    display: flex;
    align-items: center;
    gap: var(--space-6);
    justify-content: flex-start;
    /* padding: 0 0 var(--space-2); */
    padding: 0;
  }

  .mode-tabs {
    display: flex;
    font-size: var(--text-xs);
    background: var(--color-bg);
    width: 100%;
  }

  /* Each tab is a fixed slot; its own horizontal padding IS the gap between
     tabs (not a flex gap) — this matters because the slot's bottom border
     (see .mode-tab.is-previous) needs to span that gap to read as one
     continuous accent line running under the tabs before the active one. */
  .mode-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: calc(var(--radius-sm) - 2px) calc(var(--radius-sm) - 2px) 0 0;
    padding: 0 var(--space-1-5);
    cursor: pointer;
    position: relative;
    transition: background 0.1s, border-color 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 37.5px;
    box-sizing: border-box;
  }

  /* An inactive tab positioned before the active one picks up the accent
     baseline, so it visually connects into the active tab's own border. */
  .mode-tab.is-previous:not(.active) {
    border-bottom-color: var(--color-accent);
  }

  /* Boxed look for an inactive tab's label — top + side border only, so its
     open bottom edge sits flush with the slot's own border-bottom above. */
  .mode-tab-box {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-border-soft);
    border-radius: calc(var(--radius-sm) - 2px) calc(var(--radius-sm) - 2px) 0 0;
    padding: var(--space-2) var(--space-3-5);
    color: var(--color-ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: var(--weight-medium);
    white-space: nowrap;
    border-bottom: none;
  }

  .mode-tab:hover:not(.active) .mode-tab-box {
    background: var(--color-surface-tint);
    border-color: var(--color-ink);
  }

  /* Active tab: the slot itself becomes the bordered white card. */
  .mode-tab.active {
    background: var(--color-surface);
    border: 1.5px solid var(--color-accent);
    border-bottom: none;
    padding: var(--space-2) var(--space-3-5);
    gap: 2px;
    justify-content: flex-end;
  }

  .mode-tab.active:hover {
    background: var(--color-surface-tint);
  }

  .mode-tab-box, .mode-tab-active-label {
    color: var(--color-ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: var(--weight-medium);
  }

  .mode-tab-active-label {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .mode-tab.active .mode-tab-box {
    display: none;
  }

  .mode-tab.active .mode-tab-active-label {
    display: flex;
  }

  .mode-tab-underline {
    height: 2px;
    width: 66px;
    max-width: 100%;
    background: var(--color-accent);
  }

  /* Content panel sitting directly below the mode tabs picks up the same
     accent border, echoing the active tab's left edge down through the panel. */
  .foundations-card > .tab-panel {
    container-type: inline-size;
    container-name: search-panel;
    border-left: 1.5px solid var(--color-accent);
    padding-left: var(--space-3);
    padding-right: var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    min-height: 0;
    flex: 1;
    background: var(--color-surface);

  }

  .top-line {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--space-1-5);
    padding:var(--space-1-5) var(--space-4);
    padding-top: var(--space-3);

  }

  .search-input-row {
    display: flex;
    flex-wrap: wrap;
    row-gap: var(--space-1-5);
    column-gap: var(--space-2);
    align-items: center;
  }
  /* Below this width the input can't shrink any further without becoming
     unusable — stack input and button full-width instead of letting them
     crowd onto a wrapped line at their intrinsic sizes. */
  @container search-panel (max-width: 360px) {
    .search-input-row {
      flex-direction: column;
      align-items: stretch;
    }
  }
  input[type="text"] {
    flex: 1;
    min-width: 120px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-soft);
    border-radius: var(--radius-sm);
    padding: var(--space-2) 10px;
    color: var(--color-ink);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    outline: none;
    transition: border-color 0.1s, background 0.1s;
  }
  input[type="text"]:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-focus-ring);
  }
  input::placeholder { color: var(--color-ink-faint); font-weight: var(--weight-regular); font-size: var(--text-xs); }

  /* Matches the Figma "button-primary" component (node 23:1343): default/
     hover/focus/disabled below map 1:1 to its four state variants. */
  button.search-button {
    /* Without this, Chromium's native disabled-button rendering paints a
       translucent gray wash over whatever background/color :disabled sets
       below, muddying both regardless of the actual color values. */
    appearance: none;
    -webkit-appearance: none;
    background: var(--color-ink);
    color: var(--color-on-ink);
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    padding: var(--space-2-5) var(--space-4);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
    flex-shrink: 0;
  }
  /* :not(:disabled) so a lingering hover state (some browsers still match
     :hover on a disabled button) can never win the cascade over the disabled
     styling below and repaint the button dark-on-dark. */
  button.search-button:hover:not(:disabled) { background: var(--color-link-visited); }
  button.search-button:focus-visible {
    outline: none;
    border-color: var(--color-accent);
    box-shadow:
      2px 0px 4px var(--color-accent-glow),
      -2px 0px 4px var(--color-accent-glow),
      0px 2px 4px var(--color-accent-glow),
      0px -2px 4px var(--color-accent-glow);
  }
  button.search-button:disabled { background: var(--color-fill-overlay); color: var(--color-on-ink); opacity: 0.6; cursor: default; }

  button.button-secondary {
    appearance: none;
    -webkit-appearance: none;
    background: var(--color-bg);
    color: var(--color-ink);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--space-2-5) var(--space-4);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, color 0.1s, box-shadow 0.1s;
    flex-shrink: 0;
    width: 100%;
    text-align: center;
  }
  button.button-secondary:hover:not(:disabled) {
    background: var(--color-ink);
    color: var(--color-on-ink);
  }
  button.button-secondary:focus-visible {
    background: var(--color-surface-tint);
    box-shadow: 0 0 0 2px var(--color-accent);
    outline: none;
  }
  button.button-secondary:disabled {
    background: var(--color-elevated);
    color: var(--color-ink-faint);
    cursor: default;
  }

  .results-header {
    padding: var(--space-2) var(--space-3);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border-soft);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    min-height: 28px;
    row-gap: var(--space-1-5);
    column-gap: 16px;
  }

  .status {
    color: var(--color-ink-dim);
    font-size: var(--text-xs);
  }

  .scope-container {
    position: relative;
    display: inline-block;
  }

  .scope-button {
    background: var(--color-surface);
    border: 1px solid var(--color-border-soft);
    border-radius: 2px; /* Figma radius/xs */
    color: var(--color-ink);
    padding: var(--space-1-5) var(--space-2-5);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--space-2);
    transition: border-color 0.1s, background 0.1s;
    white-space: nowrap;
  }

  .scope-button:hover {
    border-color: var(--color-accent);
    background: var(--color-surface-soft);
  }

  /* Opens downward: the accent "connector" line runs down the right edge,
     continuing into .scope-dropdown below (which owns the drop-shadow, since
     it's the bottommost piece of the combined shape). */
  .scope-button.open {
    border-top: 1px solid var(--color-accent);
    border-left: 1px solid var(--color-accent);
    border-right: 2px solid var(--color-accent);
    border-bottom: none;
    border-radius: 2px 2px 0 0;
  }

  .scope-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: var(--color-surface);
    border-left: 1px solid var(--color-accent);
    border-right: 2px solid var(--color-accent);
    border-bottom: 1px solid var(--color-accent);
    border-radius: 0 0 2px 2px;
    box-shadow: 0px 2px 1px var(--color-line-default);
    z-index: 1000;
    min-width: 100%;
    overflow: hidden;
  }

  .scope-dropdown.open {
    display: block;
  }

  .scope-option {
    padding: var(--space-1-5) 10px;
    cursor: pointer;
    color: var(--color-ink-dim);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    display: flex;
    align-items: center;
    gap: var(--space-1-5);
    white-space: nowrap;
    transition: background 0.1s;
    border: none;
    background: var(--color-surface);
    width: 100%;
    text-align: left;
  }

  .scope-option:hover {
    background: var(--color-surface-tint);
  }

  .scope-option.selected {
    color: var(--color-ink);
    background: var(--color-surface-tint);
  }

  .scope-checkmark {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .scope-option.selected .scope-checkmark {
    background: var(--color-accent);
  }

  .results {
    flex: 1;
    overflow-y: auto;
    /* padding: var(--space-2) 0 64px; */
    padding: 0 0 64px;
    background: var(--color-surface);
  }

  .page-group { margin-bottom: var(--space-1); }

  .page-label {
    padding: 6px var(--space-3) var(--space-1);
    font-family: var(--font-display);
    font-size: var(--text-2xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--color-ink-faint);
    position: sticky;
    top: 0;
    background: var(--color-surface);
    z-index: 1;
    /* Extends the label's own opaque background upward by a solid-color
       shadow. Without this, the previous page-group's last row can peek
       through the sliver above the label while it's transitioning into its
       stuck position, since that sliver sits outside the label's own box. */
    box-shadow: 0 -6px 0 var(--color-surface);
  }

  /* Matches the Figma "result-items" component: an elevated card whose left
     side (name + matched tokens) and right side (node count, a bordered tab
     riding on top of the card) sit on a shared baseline via items:flex-end. */
  .component-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-3) 0;
    border-radius: 6px; /* Figma radius/md */
    margin: 0 6px var(--space-1);
    background: var(--color-elevated);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    overflow: hidden;
  }
  .component-row:hover {
    background: var(--color-surface);
    border-color: var(--color-border-soft);
  }

  .component-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px; /* Figma spacing/xs */
    padding-bottom: var(--space-2);
    min-width: 0;
  }

  .component-name {
    font-family: var(--font-display);
    font-weight: var(--weight-bold);
    color: var(--color-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-size: var(--text-md);
    letter-spacing: -0.01em;
  }

  .component-count {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-line-default);
    border-bottom: none;
    border-radius: 4px 4px 0 0; /* Figma radius/sm */
    padding: 3px var(--space-1-5); /* Figma spacing/xs, spacing/sm */
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--color-neutral-gray);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .tokens {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    min-width: 0;
  }

  .token-chip {
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    background: rgba(201, 96, 83, 0.2);
    border: 1px solid var(--color-accent);
    border-radius: 2px; /* Figma radius/xs */
    padding: var(--space-0-5) var(--space-1-5);
    color: var(--color-accent);
    /* A single long token path (e.g. "color.container.border.default") has
       nowhere to wrap to inside a flex-wrap row on its own, so it used to
       just run past .component-left's width and get clipped by
       .component-row's overflow:hidden, visually overlapping the node-count
       tab. Letting it wrap internally keeps it fully visible and lets the
       row grow tall enough to fit it. */
    overflow-wrap: anywhere;
    max-width: 100%;
  }

  .zero-results-banner {
    padding: var(--space-3);
    margin-bottom: var(--space-3);
    border: 1px dashed var(--color-border-soft);
    border-radius: var(--radius-sm);
    background: var(--color-surface-soft);
  }

  .zero-results-banner[open] .zero-results-title {
    margin-bottom: var(--space-2);
  }

  .zero-results-title {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    color: var(--color-ink-dim);
    cursor: pointer;
    list-style: none;
  }
  .zero-results-title::-webkit-details-marker { display: none; }

  .zero-results-title::before {
    content: "▶";
    display: inline-block;
    font-size: 8px;
    color: var(--color-ink-faint);
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .zero-results-banner[open] .zero-results-title::before {
    transform: rotate(90deg);
  }

  .zero-results-chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
  }

  .zero-results-chip {
    font-family: var(--font-mono);
    font-size: var(--text-3xs);
    background: transparent;
    border: 1px solid var(--color-border-soft);
    /* border-radius: var(--radius-sm); */
    border-radius: 0;
    padding: var(--space-0-5) var(--space-0-5);
    color: var(--color-ink-faint);
    text-decoration: line-through;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--color-ink-faint);
    gap: var(--space-2);
    padding: var(--space-6) var(--space-5);
    text-align: center;
    font-size: var(--text-sm);
  }

  .empty-icon { font-size: 28px; }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--color-border-soft);
    border-top-color: var(--color-ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: var(--space-1-5);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .download-section {
    padding: var(--space-3) var(--space-5);
    border-top: 1px solid var(--color-border-soft);
    display: none;
    flex-direction: row;
    gap: 0;
    flex-shrink: 0;
    align-items: stretch;
  }
  .download-section.visible {
    display: flex;
    flex-direction: row;
  }

  .download-button-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    flex: 1;
  }
  /* Download Report is the flexible half of the pair (format-container is
     fixed-width) — give it a sane minimum so it wraps to its own row below
     the format dropdown instead of being squeezed illegibly thin. */
  .download-section button.download-button {
    min-width: 140px;
  }

  .format-container {
    position: relative;
    display: inline-flex;
  }

  .format-button {
    background: var(--color-surface);
    border: 1px solid var(--color-border-soft);
    border-radius: 2px;
    color: var(--color-ink);
    padding: 6px 10px;
    width: 63px;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    transition: border-color 0.1s, background 0.1s;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .format-button:hover {
    border-color: var(--color-accent);
  }

  /* Opens upward: the dropdown sits above the trigger, so the accent
     "connector" line runs down the left edge — mirroring .scope-button/
     .scope-dropdown, which open downward with the line on the right. The
     trigger is the bottommost piece here, so it owns the drop-shadow. */
  .format-button.open {
    border-top: none;
    border-left: 2px solid var(--color-accent);
    border-right: 1px solid var(--color-accent);
    border-bottom: 1px solid var(--color-accent);
    border-radius: 0 0 2px 2px;
    box-shadow: 0px 2px 1px var(--color-line-default);
  }

  .format-dropdown {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 0;
    background: var(--color-surface);
    border-left: 2px solid var(--color-accent);
    border-top: 1px solid var(--color-accent);
    border-right: 1px solid var(--color-accent);
    border-radius: 2px 2px 0 0;
    z-index: 1000;
    min-width: 100%;
    overflow: hidden;
  }

  .format-dropdown.open {
    display: flex;
    flex-direction: column;
  }

  .format-option {
    padding: var(--space-1-5) 10px;
    cursor: pointer;
    color: var(--color-ink-dim);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    display: flex;
    align-items: center;
    gap: var(--space-1-5);
    white-space: nowrap;
    transition: background 0.1s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }

  .format-option:hover {
    background: var(--color-surface-tint);
  }

  .format-option.selected {
    color: var(--color-ink);
    background: var(--color-surface-tint);
  }

  .format-checkmark {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .format-option.selected .format-checkmark {
    background: var(--color-accent);
  }

  /* Matches the Figma "button-primary" component (node 23:1343), same as
     button.search-button above. */
  .download-section button.download-button {
    flex: 1;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    padding: var(--space-2-5) var(--space-4);
    background: var(--color-ink);
    color: var(--color-on-ink);
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
    text-align: center;
  }
  .download-section button.download-button:hover:not(:disabled) { background: var(--color-link-visited); }
  .download-section button.download-button:focus-visible {
    outline: none;
    border-color: var(--color-accent);
    box-shadow:
      2px 0px 4px var(--color-accent-glow),
      -2px 0px 4px var(--color-accent-glow),
      0px 2px 4px var(--color-accent-glow),
      0px -2px 4px var(--color-accent-glow);
  }
  .download-section button.download-button:disabled { background: var(--color-fill-overlay); color: var(--color-ink-faint); opacity: 0.6; cursor: default; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-border-soft); border-radius: 2px; }
</style>
</head>
<body>


<div class="section-title settings-title"><span class="section-title-text">Settings</span></div>

<div class="library-settings" id="librarySettingsPanel">
  <div class="settings-card">
    <div class="settings-card-title">Credits</div>
    <span class="credits-plugin-name">Variable, Style & Effect Finder</span>
    <div class="credits-row"><span>Version</span><span>2.0</span></div>
    <div class="credits-row"><span>Created by</span><span><a href="https://github.com/SilvT" target="_blank" rel="noopener noreferrer">Silvia Travieso ↗</a></span></div>
    <!-- <div class="credits-row"><span>Built with</span><span>Claude Code</span></div> -->
  </div>
</div>

<div class="foundations-card">
  <div class="section-title" id="foundationsCardTitle"><span class="section-title-text" id="foundationsCardTitleText">Find</span></div>
  <div class="mode-bar">
    <div class="mode-row">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="variable">
          <span class="mode-tab-box">Variable</span>
          <span class="mode-tab-active-label">Variable<span class="mode-tab-underline"></span></span>
        </button>
        <button class="mode-tab" data-mode="style">
          <span class="mode-tab-box">Style</span>
          <span class="mode-tab-active-label">Style<span class="mode-tab-underline"></span></span>
        </button>
        <button class="mode-tab" data-mode="effect">
          <span class="mode-tab-box">Effect</span>
          <span class="mode-tab-active-label">Effect<span class="mode-tab-underline"></span></span>
        </button>
      </div>
    </div>
  </div>
  <div class="tab-panel">
    <div class="top-line">
      <span class="toggle-label" id="multisearchToggleLabel">Single</span>
      <label class="toggle-switch">
        <input type="checkbox" id="multisearchToggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="search-input-row">
      <input id="query" type="text" placeholder="Search variable name" />
      <textarea id="queryMulti" placeholder="Paste variable names — one per line or comma-separated"></textarea>
      <button id="searchBtn" class="search-button" onclick="search()">Search</button>
    </div>
    <div class="multi-hint">Scope is set to All pages.</div>

    <div class="results-header" id="resultsHeader">
      <div class="status" id="status">Ready to search</div>
      <div class="scope-container">
        <button class="scope-button" id="scopeButton">
          <span id="scopeLabel">This page</span>
          <span>▼</span>
        </button>
        <div class="scope-dropdown" id="scopeDropdown">
          <button class="scope-option selected" data-scope="current-page">
            <span class="scope-checkmark"></span>
            <span>This page</span>
          </button>
          <button class="scope-option" data-scope="all-pages">
            <span class="scope-checkmark"></span>
            <span>All pages</span>
          </button>
        </div>
      </div>
      <div class="ignore-nesting-container">
        <span class="toggle-label">Ignore nesting</span>
        <label class="toggle-switch">
          <input type="checkbox" id="ignoreNestingToggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="results" id="results">
      <div class="empty">
        <div class="empty-icon">⊙</div>
        <div>Search supports partial matches — enter any part of a variable name.</div>
      </div>
    </div>

    <div class="download-section" id="downloadSection">
      <div class="download-button-group">
        <div class="format-container">
          <button class="format-button" id="formatButton">
            <span id="formatLabel">CSV</span>
            <span>▼</span>
          </button>
          <div class="format-dropdown" id="formatDropdown">
            <button class="format-option" data-format="json">
              <span class="format-checkmark"></span>
              <span>JSON</span>
            </button>
            <button class="format-option selected" data-format="csv">
              <span class="format-checkmark"></span>
              <span>CSV</span>
            </button>
          </div>
        </div>
        <button class="download-button" onclick="downloadReport()">Download Report</button>
      </div>
    </div>
  </div>
</div>

<div class="section-tabs">
  <nav class="floating-nav" aria-label="Search modes">

    <button class="section-tab active" data-section="component-library" data-tooltip="Find" aria-label="Find">
      <svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <button class="section-tab settings-tab" id="settingsToggle" data-tooltip="Settings" aria-label="Settings" onclick="toggleLibrarySettings()">
      <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </nav>
</div>

<script>
  const queryInput = document.getElementById("query");
  const queryMultiInput = document.getElementById("queryMulti");
  const ignoreNestingToggle = document.getElementById("ignoreNestingToggle");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const searchBtn = document.getElementById("searchBtn");
  const downloadSection = document.getElementById("downloadSection");
  const scopeButton = document.getElementById("scopeButton");
  const scopeDropdown = document.getElementById("scopeDropdown");
  const scopeLabel = document.getElementById("scopeLabel");
  const formatButton = document.getElementById("formatButton");
  const formatDropdown = document.getElementById("formatDropdown");
  const formatLabel = document.getElementById("formatLabel");

  let currentResults = null;
  let currentQuery = null;
  let currentMode = "variable";
  let currentScope = "current-page";
  let currentFormat = "csv";
  let currentSection = "component-library";
  let ignoreNesting = false;
  let multiSearchMode = false;

  const emptyResultsHtml = `<div class="empty"><div class="empty-icon">⊙</div><div>Search supports partial matches — enter any part of a variable name.</div></div>`;

  function clearResults() {
    statusEl.innerHTML = "Ready to search";
    resultsEl.innerHTML = emptyResultsHtml;
    downloadSection.classList.remove("visible");
  }

  const multisearchToggle = document.getElementById("multisearchToggle");
  multisearchToggle.addEventListener("change", () => {
    multiSearchMode = multisearchToggle.checked;
    document.body.classList.toggle("multi-search-active", multiSearchMode);
    document.getElementById("multisearchToggleLabel").textContent = multiSearchMode ? "Multiple" : "Single";
    document.querySelectorAll('.mode-tab[data-mode="style"], .mode-tab[data-mode="effect"]').forEach(t =>
      t.setAttribute("aria-disabled", multiSearchMode ? "true" : "false")
    );
    clearResults();

    if (multiSearchMode) {
      document.querySelector('.mode-tab[data-mode="variable"]').click();
      currentScope = "all-pages";
      scopeLabel.textContent = "All pages";
      document.querySelectorAll(".scope-option").forEach(o =>
        o.classList.toggle("selected", o.dataset.scope === "all-pages")
      );
    }
  });

  ignoreNestingToggle.addEventListener("change", () => {
    ignoreNesting = ignoreNestingToggle.checked;
    if (multiSearchMode && parseMultiTerms(queryMultiInput.value).length) search();
  });

  // Section tabs (Dev Mode only) — settings pill is a separate overlay toggle, not a section
  // The floating-nav pill lives in the page header, alongside whichever
  // section title is currently visible — move the single nav node into that
  // title's container rather than keeping it fixed/floating over content.
  function positionNav() {
    const nav = document.querySelector(".section-tabs");
    const target = document.body.classList.contains("library-settings-open")
      ? document.querySelector(".settings-title")
      : document.getElementById("foundationsCardTitle");
    if (target && nav.parentElement !== target) target.appendChild(nav);
  }

  document.querySelectorAll(".section-tab:not(.settings-tab)").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".section-tab:not(.settings-tab)").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");

      currentSection = tab.dataset.section;

      document.body.classList.remove("library-settings-open");
      document.getElementById("settingsToggle").classList.remove("active");
      positionNav();
    });
  });

  positionNav();

  // Mode tabs
  const placeholders = {
    variable: "Search variable name",
    style: "Search style name (spaces flexible)",
    effect: "Search effect (e.g. drop shadow, blur)"
  };

  const modeTabs = Array.from(document.querySelectorAll(".mode-tab"));
  modeTabs.forEach(tab => {
    tab.addEventListener("click", () => {
      if (multiSearchMode && tab.dataset.mode !== "variable") return;
      const activeIndex = modeTabs.indexOf(tab);
      modeTabs.forEach((t, i) => {
        t.classList.toggle("active", i === activeIndex);
        t.classList.toggle("is-previous", i < activeIndex);
      });
      currentMode = tab.dataset.mode;
      queryInput.placeholder = placeholders[currentMode];
      queryInput.focus();
    });
  });

  // Scope dropdown handlers
  scopeButton.addEventListener("click", (e) => {
    e.stopPropagation();
    scopeButton.classList.toggle("open");
    scopeDropdown.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".scope-container")) {
      scopeButton.classList.remove("open");
      scopeDropdown.classList.remove("open");
    }
  });

  document.querySelectorAll(".scope-option").forEach(option => {
    option.addEventListener("click", () => {
      const scope = option.dataset.scope;
      currentScope = scope;

      // Update UI
      document.querySelectorAll(".scope-option").forEach(o => o.classList.remove("selected"));
      option.classList.add("selected");

      scopeLabel.textContent = scope === "current-page" ? "This page" : "All pages";
      scopeButton.classList.remove("open");
      scopeDropdown.classList.remove("open");

      // Auto-search if there's a current query
      if (currentQuery) {
        search();
      }
    });
  });

  // Format dropdown handlers
  formatButton.addEventListener("click", (e) => {
    e.stopPropagation();
    formatButton.classList.toggle("open");
    formatDropdown.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".format-container")) {
      formatButton.classList.remove("open");
      formatDropdown.classList.remove("open");
    }
  });

  document.querySelectorAll(".format-option").forEach(option => {
    option.addEventListener("click", () => {
      const format = option.dataset.format;
      currentFormat = format;

      // Update UI
      document.querySelectorAll(".format-option").forEach(o => o.classList.remove("selected"));
      option.classList.add("selected");

      formatLabel.textContent = format === "csv" ? "CSV" : "JSON";
      formatButton.classList.remove("open");
      formatDropdown.classList.remove("open");
    });
  });

  queryInput.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
  queryMultiInput.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) search(); });

  function parseMultiTerms(raw) {
    const seen = new Set();
    const terms = [];
    for (const part of raw.split(/[\n,]+/)) {
      const term = part.trim();
      if (!term) continue;
      const key = term.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      terms.push(term);
    }
    return terms;
  }

  let pendingMultiTerms = null;

  // Single mode's #query is a plain text input meant for one term — pasting
  // a comma/newline-separated list into it silently produces a bogus literal
  // query (e.g. "a, b, c") instead of the multi-search the user clearly
  // wants. Block that search and offer a one-click switch instead.
  function showMultiTermError(terms) {
    pendingMultiTerms = terms;
    statusEl.textContent = "Multiple variables detected";
    resultsEl.innerHTML = `<div class="empty"><div class="empty-icon">!</div><div>Looks like you entered ${terms.length} variables — Single mode only searches one at a time.</div><button class="button-tertiary" onclick="switchToMultiFromError()">Switch to Multiple</button></div>`;
  }

  function switchToMultiFromError() {
    if (!pendingMultiTerms) return;
    queryMultiInput.value = pendingMultiTerms.join("\n");
    pendingMultiTerms = null;
    multisearchToggle.checked = true;
    multisearchToggle.dispatchEvent(new Event("change"));
    search();
  }

  function escapeCsv(value) {
    if (value === null || value === undefined) return "";
    const str = String(value);
    if (str.includes(",") || str.includes('"') || str.includes("\n")) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  }

  function formatVariantProperties(variantProperties) {
    if (!variantProperties) return "";
    return Object.entries(variantProperties)
      .map(([k, v]) => `${k}=${v}`)
      .sort()
      .join(", ");
  }

  function generateCsv(data, query, mode, scope) {
    const rows = ["Page;Component Name;Component Type;Node Name;Variant Properties;Token"];
    for (const item of data) {
      const nodes = item.nodes && item.nodes.length ? item.nodes : [{ name: "", variantProperties: null, tokens: item.tokens }];
      for (const node of nodes) {
        for (const token of node.tokens) {
          rows.push([
            escapeCsv(item.page),
            escapeCsv(item.componentName),
            escapeCsv(item.componentType),
            escapeCsv(node.name),
            escapeCsv(formatVariantProperties(node.variantProperties)),
            escapeCsv(token)
          ].join(";"));
        }
      }
    }
    return rows.join("\n");
  }

  // Freeze report runs multi-term searches, so a flat row-per-token CSV loses which
  // pasted term each row actually matched. This groups by term instead: a summary
  // block (term + match count) followed by the detail rows tagged with their term(s).
  function matchTermsForToken(token, terms) {
    const lower = token.toLowerCase();
    return terms.filter(t => lower.includes(t.toLowerCase()));
  }

  function generateFreezeCsv(data, query, scope) {
    const terms = query.split(", ");
    const termCounts = new Map(terms.map(t => [t, 0]));
    const detailRows = [];
    for (const item of data) {
      const nodes = item.nodes && item.nodes.length ? item.nodes : [{ name: "", variantProperties: null, tokens: item.tokens }];
      for (const node of nodes) {
        for (const token of node.tokens) {
          const matched = matchTermsForToken(token, terms);
          matched.forEach(t => termCounts.set(t, (termCounts.get(t) || 0) + 1));
          detailRows.push([
            escapeCsv(matched.join(" | ") || "(unmatched)"),
            escapeCsv(item.page),
            escapeCsv(item.componentName),
            escapeCsv(item.componentType),
            escapeCsv(node.name),
            escapeCsv(formatVariantProperties(node.variantProperties)),
            escapeCsv(token)
          ].join(";"));
        }
      }
    }
    const summaryRows = ["Search Term;Matches", ...terms.map(t => `${escapeCsv(t)};${termCounts.get(t) || 0}`)];
    const detailHeader = "Search Term;Page;Component Name;Component Type;Node Name;Variant Properties;Token";
    return [...summaryRows, "", detailHeader, ...detailRows].join("\n");
  }

  function generateJson(data, query, mode, scope, isFoundations) {
    const now = new Date().toISOString();
    const cleanedResults = data.map(item => ({
      page: item.page,
      componentName: item.componentName,
      componentType: item.componentType,
      tokens: item.tokens,
      nodeCount: item.nodeCount,
      nodes: item.nodes
    }));
    return JSON.stringify({
      exportDate: now,
      exportedBy: "Variable, Style & Effect Finder v2.0",
      exportedFrom: isFoundations ? "Find (multiple)" : "Find",
      searchParams: {
        mode: mode,
        query: query,
        scope: scope
      },
      results: cleanedResults
    }, null, 2);
  }

  function downloadReport() {
    if (!currentResults || !currentQuery) return;

    const format = currentFormat;
    let content, filename, mimeType;

    const date = new Date().toISOString().split("T")[0];
    const mode = currentMode === "style" ? "style" : "variable";
    // Multi-search is a multi-term audit, so it gets its own filename prefix rather
    // than a slug of every pasted term; single search keeps the single-query slug.
    const namePart = multiSearchMode
      ? "multi-search"
      : `${currentQuery.replace(/[\/\s]+/g, "-").toLowerCase().substring(0, 40)}-report`;

    if (format === "csv") {
      content = multiSearchMode
        ? generateFreezeCsv(currentResults, currentQuery, currentScope)
        : generateCsv(currentResults, currentQuery, currentMode, currentScope);
      filename = `${namePart}-${date}.csv`;
      mimeType = "text/csv;charset=utf-8;";
    } else if (format === "json") {
      content = generateJson(currentResults, currentQuery, currentMode, currentScope, multiSearchMode);
      filename = `${namePart}-${date}.json`;
      mimeType = "application/json;charset=utf-8;";
    }

    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function search() {
    const scopeLabel = currentScope === "current-page" ? "this page" : "all pages";

    if (multiSearchMode) {
      const terms = parseMultiTerms(queryMultiInput.value);
      if (!terms.length) return;
      statusEl.innerHTML = `<span class="spinner"></span>Searching ${terms.length} variable${terms.length !== 1 ? "s" : ""} ${scopeLabel}…`;
      searchBtn.disabled = true;
      resultsEl.innerHTML = "";
      currentQuery = terms.join(", ");
      parent.postMessage({ pluginMessage: { type: "search", queries: terms, mode: currentMode, scope: currentScope, ignoreNesting } }, "*");
      return;
    }

    const q = queryInput.value.trim();
    if (!q) return;
    const pastedTerms = parseMultiTerms(q);
    if (pastedTerms.length > 1) {
      showMultiTermError(pastedTerms);
      return;
    }
    statusEl.innerHTML = `<span class="spinner"></span>Searching ${scopeLabel}…`;
    searchBtn.disabled = true;
    resultsEl.innerHTML = "";
    parent.postMessage({ pluginMessage: { type: "search", query: q, mode: currentMode, scope: currentScope } }, "*");
  }

  function selectNodes(nodeIds) {
    parent.postMessage({ pluginMessage: { type: "select-nodes", nodeIds } }, "*");
  }

  function setSettingsActive(isOpen) {
    document.getElementById("settingsToggle").classList.toggle("active", isOpen);
    document.querySelectorAll(".section-tab:not(.settings-tab)").forEach(t => {
      t.classList.toggle("active", !isOpen && t.dataset.section === currentSection);
    });
  }

  function toggleLibrarySettings() {
    const isOpen = document.body.classList.toggle("library-settings-open");
    if (isOpen) {
      document.body.classList.remove("multi-search-active");
    } else {
      document.body.classList.toggle("multi-search-active", multiSearchMode);
    }
    setSettingsActive(isOpen);
    positionNav();
  }

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "editor-info") {
      document.body.classList.toggle("dev-mode", msg.editorType === "dev");
      return;
    }

    if (msg.type !== "results") return;

    searchBtn.disabled = false;
    const { data, query, mode, scope, unmatchedTerms } = msg;
    const type = mode === "style" ? "styles" : "variables";

    // Store for download
    currentResults = data;
    currentQuery = query;
    currentMode = mode;

    // Collapsed by default past a handful of misses so a large multisearch
    // (dozens of pasted variable names, many unmatched) doesn't push the
    // actual results below the fold.
    const ZERO_RESULTS_COLLAPSE_THRESHOLD = 6;
    const zeroResultsBanner = (unmatchedTerms && unmatchedTerms.length)
      ? `<details class="zero-results-banner" ${unmatchedTerms.length > ZERO_RESULTS_COLLAPSE_THRESHOLD ? "" : "open"}>
          <summary class="zero-results-title">No matches for ${unmatchedTerms.length} term${unmatchedTerms.length !== 1 ? "s" : ""}</summary>
          <div class="zero-results-chips">${unmatchedTerms.map(t => `<span class="zero-results-chip">${escHtml(t)}</span>`).join("")}</div>
        </details>`
      : "";

    if (!data.length) {
      // In Multiple mode, `query` is every pasted term joined together —
      // echoing it back in full (alongside the per-term breakdown already in
      // zeroResultsBanner below) is redundant and, with a long paste, an
      // overwhelming wall of text. Keep the exact term shown in Single mode,
      // where there's only ever one.
      statusEl.textContent = multiSearchMode ? "No results for search" : `No results for "${query}"`;
      const matchText = multiSearchMode
        ? `No components found using ${type} matching your search.`
        : `No components found using ${type} matching <strong>${escHtml(query)}</strong>.`;
      resultsEl.innerHTML = `${zeroResultsBanner}<div class="empty"><div class="empty-icon">⊙</div><div>${matchText}</div></div>`;
      downloadSection.classList.remove("visible");
      return;
    }

    // Group by page
    const byPage = {};
    for (const item of data) {
      if (!byPage[item.page]) byPage[item.page] = [];
      byPage[item.page].push(item);
    }

    const totalNodes = data.reduce((s, d) => s + d.nodeCount, 0);
    const scopeText = scope === "current-page" ? "on this page" : `across ${Object.keys(byPage).length} page${Object.keys(byPage).length !== 1 ? "s" : ""}`;
    statusEl.textContent = `${data.length} component${data.length !== 1 ? "s" : ""} · ${totalNodes} node${totalNodes !== 1 ? "s" : ""} ${scopeText}`;

    let html = zeroResultsBanner;
    for (const [page, items] of Object.entries(byPage)) {
      html += `<div class="page-group">`;
      html += `<div class="page-label">${escHtml(page)}</div>`;
      for (const item of items) {
        const tokenChips = item.tokens.map(t => `<span class="token-chip">${escHtml(t)}</span>`).join("");
        const nodeIdsJson = escHtml(JSON.stringify(item.nodeIds));
        html += `
          <div class="component-row" onclick="selectNodes(${nodeIdsJson})">
            <div class="component-left">
              <span class="component-name" title="${escHtml(item.componentName)}">${escHtml(item.componentName)}</span>
              <div class="tokens">${tokenChips}</div>
            </div>
            <div class="component-count">${item.nodeCount} node${item.nodeCount !== 1 ? "s" : ""}</div>
          </div>`;
      }
      html += `</div>`;
    }

    resultsEl.innerHTML = html;
    downloadSection.classList.add("visible");
  };

  function escHtml(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
